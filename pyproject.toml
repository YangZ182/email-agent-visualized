[project]
name = "automail-agent-studio"
version = "0.1.0"
description = "Production-grade LangGraph Email Agent platform: real-time observability tracing, Git-style diff HITL review with preference rule extraction, and evaluation dashboard with confusion matrix."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<2",
    "langchain-core>=0.3,<1",
    "langchain-google-genai>=2.0,<3",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7,<3",
    "pandas>=3.0.6",
    "numpy>=2.4.6",
    "fastapi>=0.143.1",
    "google-genai>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
